<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sparrow-General 测试矩阵</title><style>*{box-sizing:border-box}body{margin:0;background:#191919;color:#ddd;font-family:system-ui,'Segoe UI',sans-serif}main{border:1px solid #353535;border-radius:20px;margin:20px auto;padding:19px 15px 15px;max-width:920px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:20px;margin:0}header span{color:#999;font-weight:600}table{border-collapse:collapse;width:100%;margin:22px 0 15px;table-layout:fixed}th,td{border-bottom:1px solid #292929;height:51px;text-align:center}th{color:#888;font-size:11px;font-weight:500;height:32px}th:first-child,td:first-child{text-align:left;width:28%}td:first-child{font-weight:650;font-size:17px}tr:last-child td{border-bottom:0}.cell{width:100%;height:100%;border:0;background:transparent;color:#aaa;cursor:pointer;font-size:18px}.cell:hover{background:#252525}.cell:focus-visible,button:focus-visible{outline:2px solid #aaa;outline-offset:-2px}.s2{color:#35c97c}.s3{color:#ef5c5c}.legend{display:flex;flex-wrap:wrap;gap:17px;color:#aaa;font-size:15px}.legend b{padding-right:5px}.green{color:#35c97c}.red{color:#ef5c5c}p{color:#aaa;line-height:1.45;font-size:15px;margin:18px 0 14px}#reset{width:100%;border:1px solid #494949;border-radius:30px;color:#aaa;background:transparent;padding:9px;font-size:16px;cursor:pointer}#reset:hover{background:#252525}#message{color:#e3ab77;font-size:13px;min-height:0;margin:5px 0 0} @media(max-width:550px){main{margin:8px;padding:15px 10px}header span{font-size:12px}h1{font-size:17px}td:first-child{font-size:14px}th{font-size:10px}.legend{gap:8px;font-size:13px}p{font-size:13px}}</style></head><body><main><header><h1>Sparrow-General 测试矩阵</h1><span>示例验收表，可交互标记</span></header><table><thead><tr><th scope="col">测试领域</th><th scope="col">图像理解</th><th scope="col">音频理解</th><th scope="col">视频理解</th><th scope="col">生成任务</th></tr></thead><tbody id="body"></tbody></table><div class="legend"><span><b>−</b>不适用/未记录</span><span><b>◌</b>待测试</span><span><b class="green">✓</b>通过</span><span><b class="red">×</b>未通过</span></div><p>点击单元格可以切换状态。各领域与任务需分别评测，例如真实视频生成和真实视频理解需要不同的评测集。示例状态保存在当前浏览器中，清除浏览器数据或更换设备可能丢失。</p><button id="reset" type="button">重置示例矩阵</button><div id="confirm-reset" hidden><p>确定重置全部示例状态吗？</p><button id="confirm-yes" type="button">确认重置</button> <button id="confirm-no" type="button">取消</button></div><p id="message" role="status"></p></main><script>
const rows=['动漫图像','真实照片','文档/图表','自然语音','真实视频'],cols=['图像理解','音频理解','视频理解','生成任务'],symbols=['−','◌','✓','×'],labels=['不适用/未记录','待测试','通过','未通过'],key='sparrow-general-domain-matrix-v1';let data={},persistent=true;try{let saved=JSON.parse(localStorage.getItem(key)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))data=saved;localStorage.setItem(key,JSON.stringify(data))}catch(e){persistent=false}const tbody=document.getElementById('body'),message=document.getElementById('message');function save(){try{localStorage.setItem(key,JSON.stringify(data));persistent=true}catch(e){persistent=false}}function render(){tbody.textContent='';rows.forEach((row,i)=>{const tr=document.createElement('tr'),heading=document.createElement('td');heading.textContent=row;tr.append(heading);cols.forEach((col,j)=>{let k=i+':'+j,v=Number.isInteger(data[k])&&data[k]>=0&&data[k]<4?data[k]:0;let td=document.createElement('td'),b=document.createElement('button');b.type='button';b.className='cell s'+v;b.textContent=symbols[v];b.setAttribute('aria-label',row+'，'+col+'：'+labels[v]+'。点击切换');b.onclick=()=>{v=(v+1)%4;data[k]=v;save();b.className='cell s'+v;b.textContent=symbols[v];b.setAttribute('aria-label',row+'，'+col+'：'+labels[v]+'。点击切换');message.textContent=persistent?'':'当前浏览器不允许保存，刷新后状态可能丢失。'};td.append(b);tr.append(td)});tbody.append(tr)});message.textContent=persistent?'':'当前浏览器不允许保存，刷新后状态可能丢失。'}const resetConfirm=document.getElementById('confirm-reset');document.getElementById('reset').onclick=()=>{resetConfirm.hidden=false;document.getElementById('confirm-yes').focus()};document.getElementById('confirm-no').onclick=()=>{resetConfirm.hidden=true;document.getElementById('reset').focus()};document.getElementById('confirm-yes').onclick=()=>{data={};save();render();resetConfirm.hidden=true;document.getElementById('reset').focus()};render();
</script></body></html>
