<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f8f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0faf9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#35bfab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2da99b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bgGrad)" rx="20"/>

  <!-- Grid dots pattern -->
  <g opacity="0.15">
    <circle cx="60" cy="40" r="2" fill="#35bfab"/>
    <circle cx="120" cy="40" r="2" fill="#35bfab"/>
    <circle cx="180" cy="40" r="2" fill="#35bfab"/>
    <circle cx="240" cy="40" r="2" fill="#35bfab"/>
    <circle cx="60" cy="100" r="2" fill="#35bfab"/>
    <circle cx="120" cy="100" r="2" fill="#35bfab"/>
    <circle cx="180" cy="100" r="2" fill="#35bfab"/>
    <circle cx="60" cy="160" r="2" fill="#35bfab"/>
    <circle cx="120" cy="160" r="2" fill="#35bfab"/>
    <circle cx="720" cy="40" r="2" fill="#35bfab"/>
    <circle cx="780" cy="40" r="2" fill="#35bfab"/>
    <circle cx="840" cy="40" r="2" fill="#35bfab"/>
    <circle cx="720" cy="100" r="2" fill="#35bfab"/>
    <circle cx="780" cy="100" r="2" fill="#35bfab"/>
    <circle cx="840" cy="100" r="2" fill="#35bfab"/>
    <circle cx="720" cy="160" r="2" fill="#35bfab"/>
    <circle cx="780" cy="160" r="2" fill="#35bfab"/>
    <circle cx="840" cy="160" r="2" fill="#35bfab"/>
  </g>

  <!-- Left decoration: GPU chip illustration -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="70" height="70" rx="8" fill="white" stroke="#35bfab" stroke-width="2" opacity="0.8"/>
    <rect x="10" y="10" width="50" height="50" rx="4" fill="#35bfab" opacity="0.15"/>
    <!-- Chip grid -->
    <rect x="18" y="18" width="10" height="10" rx="2" fill="#35bfab" opacity="0.6"/>
    <rect x="32" y="18" width="10" height="10" rx="2" fill="#35bfab" opacity="0.6"/>
    <rect x="46" y="18" width="10" height="10" rx="2" fill="#35bfab" opacity="0.4"/>
    <rect x="18" y="32" width="10" height="10" rx="2" fill="#35bfab" opacity="0.4"/>
    <rect x="32" y="32" width="10" height="10" rx="2" fill="#35bfab" opacity="0.8"/>
    <rect x="46" y="32" width="10" height="10" rx="2" fill="#35bfab" opacity="0.6"/>
    <rect x="18" y="46" width="10" height="10" rx="2" fill="#35bfab" opacity="0.6"/>
    <rect x="32" y="46" width="10" height="10" rx="2" fill="#35bfab" opacity="0.4"/>
    <rect x="46" y="46" width="10" height="10" rx="2" fill="#35bfab" opacity="0.7"/>
    <!-- Pins -->
    <line x1="-8" y1="20" x2="0" y2="20" stroke="#35bfab" stroke-width="2"/>
    <line x1="-8" y1="35" x2="0" y2="35" stroke="#35bfab" stroke-width="2"/>
    <line x1="-8" y1="50" x2="0" y2="50" stroke="#35bfab" stroke-width="2"/>
    <line x1="70" y1="20" x2="78" y2="20" stroke="#35bfab" stroke-width="2"/>
    <line x1="70" y1="35" x2="78" y2="35" stroke="#35bfab" stroke-width="2"/>
    <line x1="70" y1="50" x2="78" y2="50" stroke="#35bfab" stroke-width="2"/>
    <line x1="20" y1="-8" x2="20" y2="0" stroke="#35bfab" stroke-width="2"/>
    <line x1="35" y1="-8" x2="35" y2="0" stroke="#35bfab" stroke-width="2"/>
    <line x1="50" y1="-8" x2="50" y2="0" stroke="#35bfab" stroke-width="2"/>
  </g>

  <!-- Left code snippet -->
  <g transform="translate(165, 55)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="white" stroke="#e0f5f2" stroke-width="1.5" opacity="0.9"/>
    <rect x="0" y="0" width="160" height="26" rx="10" fill="#35bfab" opacity="0.15"/>
    <rect x="0" y="13" width="160" height="13" fill="#35bfab" opacity="0.15"/>
    <!-- Dots -->
    <circle cx="14" cy="13" r="4" fill="#ff6b6b" opacity="0.7"/>
    <circle cx="26" cy="13" r="4" fill="#ffd93d" opacity="0.7"/>
    <circle cx="38" cy="13" r="4" fill="#6bcb77" opacity="0.7"/>
    <!-- Code lines -->
    <rect x="12" y="36" width="60" height="7" rx="3" fill="#35bfab" opacity="0.5"/>
    <rect x="76" y="36" width="40" height="7" rx="3" fill="#334f52" opacity="0.2"/>
    <rect x="20" y="52" width="80" height="7" rx="3" fill="#334f52" opacity="0.15"/>
    <rect x="20" y="66" width="50" height="7" rx="3" fill="#35bfab" opacity="0.3"/>
    <rect x="74" y="66" width="30" height="7" rx="3" fill="#334f52" opacity="0.2"/>
    <rect x="20" y="80" width="90" height="7" rx="3" fill="#334f52" opacity="0.12"/>
    <rect x="12" y="96" width="40" height="7" rx="3" fill="#35bfab" opacity="0.4"/>
    <rect x="56" y="96" width="20" height="7" rx="3" fill="#334f52" opacity="0.15"/>
  </g>

  <!-- Central text area -->
  <g transform="translate(360, 50)">
    <!-- Main title -->
    <text x="90" y="55" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#334f52" text-anchor="middle" opacity="0.9">Twojian's Space</text>
    <!-- Subtitle -->
    <text x="90" y="80" font-family="'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" fill="#35bfab" text-anchor="middle" opacity="0.85">AI · 深度学习 · 408考研 · 全栈开发</text>
    <!-- Decorative line -->
    <line x1="30" y1="92" x2="150" y2="92" stroke="#35bfab" stroke-width="1.5" opacity="0.4"/>
    <!-- Tag pills -->
    <rect x="10" y="106" width="60" height="22" rx="11" fill="#35bfab" opacity="0.12"/>
    <text x="40" y="122" font-family="sans-serif" font-size="11" fill="#35bfab" text-anchor="middle" opacity="0.9">AI Infra</text>
    <rect x="78" y="106" width="70" height="22" rx="11" fill="#35bfab" opacity="0.12"/>
    <text x="113" y="122" font-family="sans-serif" font-size="11" fill="#35bfab" text-anchor="middle" opacity="0.9">深度学习</text>
    <rect x="156" y="106" width="56" height="22" rx="11" fill="#35bfab" opacity="0.12"/>
    <text x="184" y="122" font-family="sans-serif" font-size="11" fill="#35bfab" text-anchor="middle" opacity="0.9">NLP</text>
    <!-- bottom quote -->
    <text x="90" y="155" font-family="'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" fill="#334f52" text-anchor="middle" opacity="0.4">记录可复用、可验证、可长期维护的知识</text>
  </g>

  <!-- Right neural network illustration -->
  <g transform="translate(640, 40)">
    <!-- Nodes layer 1 -->
    <circle cx="20" cy="40" r="12" fill="white" stroke="#35bfab" stroke-width="2"/>
    <circle cx="20" cy="80" r="12" fill="white" stroke="#35bfab" stroke-width="2"/>
    <circle cx="20" cy="120" r="12" fill="white" stroke="#35bfab" stroke-width="2"/>
    <circle cx="20" cy="160" r="12" fill="white" stroke="#35bfab" stroke-width="2"/>
    <!-- Nodes layer 2 -->
    <circle cx="80" cy="55" r="14" fill="url(#tealGrad)" opacity="0.8"/>
    <circle cx="80" cy="105" r="14" fill="url(#tealGrad)" opacity="0.8"/>
    <circle cx="80" cy="145" r="14" fill="url(#tealGrad)" opacity="0.8"/>
    <!-- Nodes layer 3 -->
    <circle cx="140" cy="70" r="12" fill="white" stroke="#35bfab" stroke-width="2"/>
    <circle cx="140" cy="120" r="12" fill="white" stroke="#35bfab" stroke-width="2"/>
    <!-- Output node -->
    <circle cx="195" cy="95" r="16" fill="url(#tealGrad)"/>
    <text x="195" y="100" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">✓</text>
    <!-- Connections L1→L2 -->
    <line x1="32" y1="40" x2="66" y2="55" stroke="#35bfab" stroke-width="1" opacity="0.3"/>
    <line x1="32" y1="40" x2="66" y2="105" stroke="#35bfab" stroke-width="1" opacity="0.2"/>
    <line x1="32" y1="80" x2="66" y2="55" stroke="#35bfab" stroke-width="1.5" opacity="0.5"/>
    <line x1="32" y1="80" x2="66" y2="105" stroke="#35bfab" stroke-width="1" opacity="0.3"/>
    <line x1="32" y1="80" x2="66" y2="145" stroke="#35bfab" stroke-width="1" opacity="0.2"/>
    <line x1="32" y1="120" x2="66" y2="55" stroke="#35bfab" stroke-width="1" opacity="0.2"/>
    <line x1="32" y1="120" x2="66" y2="105" stroke="#35bfab" stroke-width="1.5" opacity="0.5"/>
    <line x1="32" y1="120" x2="66" y2="145" stroke="#35bfab" stroke-width="1" opacity="0.3"/>
    <line x1="32" y1="160" x2="66" y2="105" stroke="#35bfab" stroke-width="1" opacity="0.2"/>
    <line x1="32" y1="160" x2="66" y2="145" stroke="#35bfab" stroke-width="1.5" opacity="0.4"/>
    <!-- Connections L2→L3 -->
    <line x1="94" y1="55" x2="128" y2="70" stroke="#35bfab" stroke-width="1.5" opacity="0.5"/>
    <line x1="94" y1="55" x2="128" y2="120" stroke="#35bfab" stroke-width="1" opacity="0.2"/>
    <line x1="94" y1="105" x2="128" y2="70" stroke="#35bfab" stroke-width="1" opacity="0.3"/>
    <line x1="94" y1="105" x2="128" y2="120" stroke="#35bfab" stroke-width="1.5" opacity="0.5"/>
    <line x1="94" y1="145" x2="128" y2="70" stroke="#35bfab" stroke-width="1" opacity="0.2"/>
    <line x1="94" y1="145" x2="128" y2="120" stroke="#35bfab" stroke-width="1" opacity="0.3"/>
    <!-- Connections L3→Output -->
    <line x1="152" y1="70" x2="179" y2="95" stroke="#35bfab" stroke-width="2" opacity="0.6"/>
    <line x1="152" y1="120" x2="179" y2="95" stroke="#35bfab" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Floating decorations -->
  <!-- Stars -->
  <g filter="url(#glow)">
    <text x="30" y="50" font-size="18" opacity="0.6" fill="#35bfab">✦</text>
    <text x="850" y="50" font-size="14" opacity="0.5" fill="#35bfab">✦</text>
    <text x="310" y="200" font-size="12" opacity="0.4" fill="#35bfab">✦</text>
    <text x="600" y="205" font-size="16" opacity="0.5" fill="#35bfab">✦</text>
    <text x="870" y="180" font-size="12" opacity="0.4" fill="#35bfab">★</text>
  </g>
  <!-- Floating math symbols -->
  <text x="155" y="200" font-family="serif" font-size="20" opacity="0.15" fill="#334f52">∑</text>
  <text x="800" y="25" font-family="serif" font-size="16" opacity="0.12" fill="#334f52">∇</text>
  <text x="340" y="30" font-family="serif" font-size="14" opacity="0.12" fill="#334f52">∂L/∂w</text>
</svg>
